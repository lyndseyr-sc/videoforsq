<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스낵큐레이션 교육영상자료 아카이브</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFFDF0; /* 파스텔 노랑 배경 */
      color: #222222;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 첫 화면 (표지 이미지) */
    #cover-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      cursor: pointer;
    }

    .cover-image {
      width: 100%;
      max-width: 720px;
      height: auto;
      border-radius: 16px;
      transition: transform 0.2s ease;
    }

    #cover-screen:hover .cover-image {
      transform: scale(1.01);
    }

    /* 영상 목록 화면 (처음엔 숨김) */
    #archive-screen {
      display: none;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 이미지가 채워진 제목 배너 */
    header {
      position: relative;
      text-align: center;
      margin-bottom: 48px;
      padding: 100px 24px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #E8DFB8;
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('mainimage2.png');
      background-size: cover;
      background-position: center 45%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* 영상 그리드 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(640px, 1fr));
      gap: 32px;
    }

    @media (max-width: 700px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }
