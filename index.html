<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스낵큐레이션 교육영상자료 아카이브</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFFDF0;
      color: #222222;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    #cover-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      cursor: pointer;
    }

    .cover-image {
      width: 100%;
      max-width: 720px;
      height: auto;
      border-radius: 16px;
    }

    #archive-screen {
      display: none;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      position: relative;
      text-align: center;
      margin-bottom: 48px;
      padding: 100px 24px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #E8DFB8;
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('mainimage2.png');
      background-size: cover;
      background-position: center 45%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(640px, 1fr));
      gap: 32px;
    }

    @media (max-width: 700px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background-color: #FFFFFF;
      border: 1px solid #EAE4C8;
      border-radius: 16px;
      overflow: hidden;
    }

    .video-wrapper {
      width: 100%;
      min-height: 450px;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }

    .video-wrapper video {
      width: 100%;
      height: auto;
      max-height: 85vh;
      display: block;
      object-fit: contain;
    }

    .video-info {
      padding: 24px;
    }

    .video-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111111;
    }

    .video-desc {
      font-size: 1.05rem;
      color: #444444;
    }
  </style>
</head>
<body>

  <div id="cover-screen" onclick="openArchive()">
    <img src="mainimage2.png" alt="두두와 페피가 함께 배우는 링키지랩 윤리규정" class="cover-image">
  </div>

  <div id="archive-screen">
    <header>
      <h1>스낵큐레이션 교육영상자료 아카이브</h1>
    </header>

    <main class="video-grid">
      <article class="video-card">
        <div class="video-wrapper">
          <video controls playsinline preload="metadata">
            <source src="video_2.mp4" type="video/mp4">
            브라우저가 비디오 재생을 지원하지 않습니다.
          </video>
        </div>
        <div class="video-info">
          <h2 class="video-title">소중한 링키지랩의 자산 지키기</h2>
          <p class="video-desc">회사 물건을 개인적으로 쓰지 않고, 고장 나거나 잃어버리지 않게 잘 관리하는 방법을 알아봅니다.</p>
        </div>
      </article>
    </main>
  </div>

  <script>
    function openArchive() {
      document.getElementById('cover-screen').style.display = 'none';
      document.getElementById('archive-screen').style.display = 'block';
    }
  </script>

</body>
</html>
