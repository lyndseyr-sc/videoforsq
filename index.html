<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스낵큐레이션 교육영상자료 아카이브</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFFDF0; /* 파스텔 노랑 배경 */
      color: #222222;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 첫 화면 (표지 이미지) */
    #cover-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      cursor: pointer;
    }

    .cover-image {
      width: 100%;
      max-width: 720px;
      height: auto;
      border-radius: 16px;
      transition: transform 0.2s ease;
    }

    #cover-screen:hover .cover-image {
      transform: scale(1.01);
    }

    /* 영상 목록 화면 (처음엔 숨김) */
    #archive-screen {
      display: none;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 이미지가 채워진 제목 배너 */
    header {
      position: relative;
      text-align: center;
      margin-bottom: 48px;
      padding: 100px 24px;
      border-radius: 16px;
      overflow: hidden;
      background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('./mainimage1.png');
      background-size: cover;
      background-position: center 45%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .video-card {
      background-color: #FFFFFF;
      border: 1px solid #EAE4C8;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 비율 */
      height: 0;
      background-color: #000000;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 20px;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111111;
    }

    .video-desc {
      font-size: 1rem;
      color: #444444;
    }
  </style>
</head>
<body>

  <!-- 1. 첫 화면: 이미지만 표시 (클릭 시 목록으로 이동) -->
  <div id="cover-screen" onclick="openArchive()">
    <img 
      src="./mainimage1.png" 
      onerror="if(!this.dataset.retry){this.dataset.retry=1; this.src='./mainimage1.PNG';}"
      alt="두두와 페피가 함께 배우는 링키지랩 윤리규정 (클릭해서 입장)" 
      class="cover-image"
    >
  </div>

  <!-- 2. 영상 목록 화면 -->
  <div id="archive-screen">
    <header>
      <h1>스낵큐레이션 교육영상자료 아카이브</h1>
    </header>

    <main class="video-grid">
      <!-- 영상 카드 1 -->
      <article class="video-card">
        <div class="video-wrapper">
          <video controls playsinline preload="metadata">
            <source src="./video_2.mp4" type="video/mp4">
            브라우저가 비디오 재생을 지원하지 않습니다.
          </video>
        </div>
        <div class="video-info">
          <h2 class="video-title">소중한 링키지랩의 자산 지키기</h2>
          <p class="video-desc">회사 물건을 개인적으로 쓰지 않고, 고장 나거나 잃어버리지 않게 잘 관리하는 방법을 알아봅니다.</p>
        </div>
      </article>
    </main>
  </div>

  <script>
    function openArchive() {
      document.getElementById('cover-screen').style.display = 'none';
      document.getElementById('archive-screen').style.display = 'block';
    }
  </script>

</body>
</html>
